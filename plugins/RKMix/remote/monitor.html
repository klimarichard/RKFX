<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<meta name="theme-color" content="#1c1d20">
<link rel="manifest" href="/manifest/{{KEY}}.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>{{TITLE}}</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1d1e21; overscroll-behavior:none; }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  canvas { display:block; touch-action:none; }
  #safe { position:fixed; visibility:hidden; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="safe"></div>
<script src="/c/rk.js"></script>
<script>
// RKMix's monitor remote: one musician's in-ear mix on a phone, drawn with the
// suite's own controls (rk.js: the palette, the console fader's cap and track,
// the meters, the pans, the switches). Slide a row sideways for its level;
// slide up and down to scroll. Double-tap a pan for the centre.
"use strict";
(() => {
const KEY = "{{KEY}}";
const { Colour, Palette, J, Component, TextButton, ToggleSwitch, LinearSlider, ParamComponent, EqEditor, app, store, drawPanel, faderDbAt, faderPositionOf, fine, FineButton } = RK;

const dbText = db => db <= -99.9 ? "-inf" : (db > 0.05 ? "+" : "") + (Math.abs(db) < 0.05 ? 0 : db).toFixed(1);
const panOf = n => Math.round(n * 200 - 100);
const panText = n => { const w = panOf(n); return w === 0 ? "C" : (w < 0 ? "L" : "R") + Math.abs(w); };
const linToDb = v => v > 0.00001 ? 20 * Math.log10(v) : -100;

let ws = null, mix = null, showAll = false, locked = false, connected = false, gone = "", lastNow = "null";
const isLocked = () => locked;

// This phone's own layout of this mix, kept on the phone (per mix link):
// the channels starred to the top ("Me") and whether the pans are hidden.
const layout = { me: new Set(), hidePans: false };
const layoutKey = "rkmix.monitor.layout." + KEY;
try {
  const v = JSON.parse(localStorage.getItem(layoutKey) || "{}");
  if (Array.isArray(v.me)) layout.me = new Set(v.me.map(String));
  layout.hidePans = !!v.hidePans;
} catch (_) {}
function saveLayout() {
  try { localStorage.setItem(layoutKey, JSON.stringify({ me: [...layout.me], hidePans: layout.hidePans })); } catch (_) {}
}

// What the show is at (Gig Performer's rackspace and variation, sent to RKMix
// by OSC): a strip under the header, there only while there's a name.
const nowOf = m => m && m.now && (m.now.t || m.now.s) ? m.now : null;
const kNowH = 40;
const kHeadingH = 26;   // the list's "Me" and "Others" headings
function drawNow(g, now, x, y, w, h) {
  drawPanel(g, x, y, w, h, Palette.tintedPanel);
  g.setColour(Palette.accent); g.fillRoundedRectangle(x, y, 4, h, 2);
  const pad = 12, room = w - 2 * pad;
  g.setFont(16, true);
  const tw = now.t ? Math.min(g.textWidth(now.t), now.s ? room * 0.65 : room) : 0;
  if (now.t) { g.setColour(Palette.text); g.drawText(now.t, x + pad, y, tw, h, J.centredLeft); }
  if (now.s) {
    const sx = x + pad + (tw ? tw + 10 : 0);
    g.setFont(14); g.setColour(Palette.textDim); g.drawText(now.s, sx, y, x + w - pad - sx, h, J.centredLeft);
  }
}
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

// A channel's EQ in this mix (its send EQ): the fields as the server sends
// them (normalised, in this order), their ranges, defaults and text.
const eqFields = ["on", "lc", "lsf", "lsg", "mf", "mg", "mq", "hsf", "hsg"];
const eqDefaults = { on: 0, lc: 0, lsf: Math.log(150 / 40) / Math.log(500 / 40), lsg: 0.5, mf: Math.log(1000 / 200) / Math.log(40),
                     mg: 0.5, mq: Math.log(2) / Math.log(8), hsf: Math.log(4) / Math.log(8), hsg: 0.5 };
const eqId = (k, f) => "seq:" + k + ":" + f;
const logHz = (n, lo, hi) => lo * Math.pow(hi / lo, n);
const hzText = hz => hz >= 1000 ? (hz / 1000).toFixed(hz >= 10000 ? 1 : 2) + " kHz" : Math.round(hz) + " Hz";
const gainText = n => { const db = n * 30 - 15; return (db > 0.05 ? "+" : "") + (Math.abs(db) < 0.05 ? "0.0" : db.toFixed(1)) + " dB"; };
const eqCurves = new Map();   // row key -> the curve the server sends (dB, 20 Hz to 20 kHz), when not flat

// The store's IDs here: "fader", "mute", "send:<row>", "pan:<row>", "seq:<row>:<field>"; a set becomes the monitor message.
store.send = msg => {
  if (msg.t !== "set") return;
  const id = msg.id, n = msg.v;
  if (id === "fader") send({ t: "fader", v: +faderDbAt(n).toFixed(2) });
  else if (id === "mute") send({ t: "mute", v: n >= 0.5 ? 1 : 0 });
  else if (id.startsWith("send:")) send({ t: "send", k: id.slice(5), v: +faderDbAt(n).toFixed(2) });
  else if (id.startsWith("pan:")) send({ t: "pan", k: id.slice(4), v: panOf(n) });
  else if (id.startsWith("seq:")) { const [, k, f] = id.split(":"); send({ t: "seq", k, f, n: +n.toFixed(5) }); }
};

// A meter's ballistics (MixGui::Meter): falls at 24 dB/s, holds 1.5 s.
class Ballistics {
  constructor() { this.peak = -100; this.shown = -100; this.hold = -100; this.holdT = 0; }
  feed(db) { this.peak = Math.max(this.peak, db); }
  step(dt) {
    const db = this.peak; this.peak = -100;
    const shown = Math.max(db, this.shown - 24 * dt);
    if (db >= this.hold) { this.hold = db; this.holdT = 0; } else if ((this.holdT += dt) > 1.5) this.hold = shown;
    const moved = Math.abs(shown - this.shown) > 0.2; this.shown = shown; return moved;
  }
}

// MixGui::Fader laid sideways: the track, the cap with its line, the 0 dB
// mark, the level's meter under it. It moves from where it was (relative),
// never to the finger.
class SideFader extends ParamComponent {
  constructor(id) { super(id); this.capColour = Palette.knobTrack; this.meter = new Ballistics(); this.showScale = false; this.locked = isLocked; }
  range() { return [16, this.w - 16]; }
  xFor(n) { const [a, b] = this.range(); return a + n * (b - a); }
  paint(g) {
    const cy = this.showScale ? this.h * 0.42 : this.h * 0.45, [l, r] = this.range();
    if (this.showScale) {
      g.setFont(9.5);
      for (const db of [-100, -40, -20, -10, 0, 10]) {
        const x = this.xFor(faderPositionOf(db));
        g.setColour(Palette.outline); g.drawVerticalLine(x, cy - 17, cy - 13);
        g.setColour(db === 0 ? Palette.text : Palette.textDim);
        g.drawText(db <= -100 ? "-inf" : db > 0 ? "+" + db : String(db), x - 20, cy - 30, 40, 12, J.centred, false);
      }
    }
    g.setColour(Palette.knobTrack); g.fillRoundedRectangle(l, cy - 2, r - l, 4, 2);
    const unity = this.xFor(faderPositionOf(0));
    g.setColour(Palette.textDim.withAlpha(0.6)); g.fillRect(unity - 0.5, cy - 8, 1, 16);
    // the meter: a thin bar, accent to 0 dB, warning above, a hold line
    const my = this.h - 5, m = this.meter;
    g.setColour(Palette.knobBody); g.fillRect(l, my, r - l, 4);
    if (m.shown > -60) {
      const x = this.xFor(faderPositionOf(m.shown)), zero = unity;
      g.setColour(Palette.accent); g.fillRect(l, my, Math.min(x, zero) - l, 4);
      if (x > zero) { g.setColour(Palette.warning); g.fillRect(zero, my, x - zero, 4); }
    }
    if (m.hold > -60) { g.setColour(m.hold > 0 ? Palette.warning : Palette.text); g.fillRect(this.xFor(faderPositionOf(m.hold)) - 1, my, 2, 4); }
    // the cap (sideways: 26 wide, 30 high, its line upright)
    const capW = 26, capH = 30, cx = this.xFor(this.norm), left = cx - capW / 2, top = cy - capH / 2;
    const a = locked ? 0.55 : 1;
    const cap = this.active ? this.capColour.brighter(0.25) : this.capColour;
    g.setColour(cap.darker(0.2).withMultipliedAlpha(a)); g.fillRoundedRectangle(left, top, capW, capH, 3);
    g.setColour(cap.brighter(0.3).withMultipliedAlpha(a)); g.drawRoundedRectangle(left + 0.5, top + 0.5, capW - 1, capH - 1, 3, 1);
    g.setColour(Palette.text.withMultipliedAlpha(a)); g.fillRect(cx - 1, top + 3, 2, capH - 6);
  }
  pointerDown(e) {
    if (locked) return false;
    this.lastX = e.x; this.dragN = this.norm; this.active = true; store.hold(this.id, true); this.repaint(); return true;
  }
  pointerMove(e) {
    const [a, b] = this.range(), delta = (e.x - this.lastX) / Math.max(150, b - a) * fine.scale(); this.lastX = e.x;
    this.dragN = Math.max(0, Math.min(1, this.dragN + delta)); this.setNorm(this.dragN);
  }
  pointerUp() { this.active = false; store.hold(this.id, false); this.repaint(); }
}

// The bus's own fader and Mute, always on top.
class MasterPanel extends Component {
  constructor() {
    super();
    this.fader = this.add(new SideFader("fader")); this.fader.showScale = true;
    this.mute = this.add(new ToggleSwitch("mute", Palette.warning, "Mute")); this.mute.locked = isLocked;
  }
  resized() { this.mute.setBounds(this.w - 10 - 78, 8, 78, 30); this.fader.setBounds(4, 40, this.w - 8, 58); }
  paint(g) {
    drawPanel(g, 0, 0, this.w, this.h, Palette.tintedPanel);
    g.setColour(Palette.text); g.setFont(15, true); g.drawText("My mix", 12, 8, 120, 30, J.centredLeft);
    g.setColour(Palette.text); g.setFont(14);
    g.drawText(dbText(faderDbAt(this.fader.norm)) + " dB", this.w - 100 - 110, 8, 104, 30, J.centredRight);
  }
}

// A row's star: tap it to keep the channel on top (in "Me"), again to put it back.
class Star extends TextButton {
  constructor(key) {
    super("", () => {
      if (locked) return;
      if (layout.me.has(key)) layout.me.delete(key); else layout.me.add(key);
      saveLayout(); render();
    });
  }
  paint(g) {
    const on = layout.me.has(this.parent.key), a = locked ? 0.45 : 1;
    g.setColour((on ? Palette.accent : Palette.textDim).withMultipliedAlpha(this.down ? 0.7 * a : a));
    g.setFont(19); g.drawText(on ? "\u2605" : "\u2606", 0, 0, this.w, this.h, J.centred);
  }
}

// One channel (or return) in the mix: its colour, name, level, meter and pan.
class Row extends Component {
  constructor(r) {
    super(); this.key = r.k;
    this.star = this.add(new Star(r.k));
    this.fader = this.add(new SideFader("send:" + r.k));
    this.pan = this.add(new LinearSlider("pan:" + r.k)); this.pan.locked = isLocked;
    this.pan.popupText = () => panText(this.pan.norm);
    // Its EQ in this mix (channels only): lit when on; tap for the EQ sheet.
    this.eq = this.add(new TextButton("EQ", () => { if (!locked && this.r && this.r.eq) root.sheet.open(this.r); }));
    this.eq.fontHeight = 12; this.eq.bold = true;
  }
  update(r, own) {
    this.r = r; this.hasPan = own && !r.ret && !layout.hidePans; this.pan.setVisible(this.hasPan); this.colour = Colour.hex(r.colour);
    this.eq.setVisible(!!r.eq); this.eq.toggle = !!r.eq && store.on(eqId(r.k, "on"));
  }
  height() { return this.hasPan ? 112 : 86; }
  resized() {
    this.star.setBounds(8, 2, 30, 30); this.eq.setBounds(this.w - 86 - 48, 5, 44, 24);
    this.fader.setBounds(6, 28, this.w - 12, 50); this.pan.setBounds(54, 82, this.w - 54 - 22, 22);
  }
  paint(g) {
    drawPanel(g, 0, 0, this.w, this.h, Palette.tintedPanel);
    g.setColour(this.colour); g.fillRoundedRectangle(0, 0, 5, this.h, 2.5);
    g.setColour(Palette.text); g.setFont(14.5, true); g.drawText(this.r.name, 40, 6, this.w - 146 - (this.r.eq ? 52 : 0), 22, J.centredLeft);
    g.setColour(Palette.textDim); g.setFont(12.5);
    if (this.r.ret) g.drawText("return", this.w - 160, 6, 70, 22, J.centredRight);
    g.setColour(Palette.text); g.setFont(14);
    g.drawText(dbText(faderDbAt(this.fader.norm)), this.w - 86, 6, 74, 22, J.centredRight);
    if (this.hasPan) {
      g.setColour(Palette.textDim); g.setFont(12.5);
      g.drawText("Pan " + panText(this.pan.norm), 14, 82, 60, 22, J.centredLeft);
    }
  }
}

// The scrolling list: a sideways slide moves the row's level (or pan), an
// upright one scrolls (with momentum); a tap presses a button.
class List extends Component {
  constructor() {
    super(); this.takesTouches = true; this.scroll = 0; this.velocity = 0; this.content = this.add(new Component());
    this.rows = new Map(); this.order = [];
    this.allButton = this.content.add(new TextButton("Show all channels", () => { showAll = !showAll; render(); }));
    this.lastTap = { target: null, time: 0 };
    app.frameHooks.add(dt => this.coast(dt));
  }
  find(x, y) { return this.visible && this.hitTest(x, y) ? this : null; }
  // me: the starred rows (on top), others: the rest; own: the mix has its own pans.
  setRows(me, others, own) {
    const rows = me.concat(others), keep = new Map();
    this.meCount = me.length; this.othersCount = others.length;
    for (const r of rows) {
      let row = this.rows.get(r.k);
      if (!row) row = this.content.add(new Row(r));
      row.update(r, own); keep.set(r.k, row);
    }
    for (const [k, row] of this.rows) if (!keep.has(k)) this.content.remove(row);
    this.rows = keep; this.order = rows.map(r => keep.get(r.k));
    this.allButton.text = showAll ? "Show only what's in the mix" : "Show all channels";
    this.layout();
  }
  layout() {
    // With starred rows: a "Me" heading over them, "Others" over the rest.
    let y = 0; this.headings = [];
    const heading = text => { this.headings.push({ text, y }); y += kHeadingH; };
    this.order.forEach((row, i) => {
      if (this.meCount && i === 0) heading("Me");
      if (this.meCount && i === this.meCount) heading("Others");
      row.setBounds(0, y, this.w, row.height()); y += row.height() + 6;
    });
    this.emptyY = y;
    if (!this.order.length) y += 60;
    const bw = Math.min(260, this.w), bx = Math.max(0, (this.w - 260) / 2);
    this.allButton.setBounds(bx, y + 8, bw, 36);
    this.contentHeight = y + 8 + 36 + 70;
    this.content.setBounds(0, -this.scroll, this.w, this.contentHeight);
    this.clamp();
  }
  resized() { this.layout(); }
  maxScroll() { return Math.max(0, (this.contentHeight || 0) - this.h); }
  clamp() { this.scroll = Math.max(0, Math.min(this.maxScroll(), this.scroll)); this.content.y = -this.scroll; this.repaint(); }
  coast(dt) {
    if (this.touch || Math.abs(this.velocity) < 5) { this.velocity = this.touch ? this.velocity : 0; return; }
    this.scroll += this.velocity * dt; this.velocity *= Math.pow(0.04, dt);
    const before = this.scroll; this.clamp(); if (this.scroll !== before) this.velocity = 0;
  }
  draw(g) {
    if (!this.visible) return;
    const c = g.ctx; c.save(); c.beginPath(); c.rect(this.x, this.y, this.w, this.h); c.clip();
    super.draw(g); c.restore();
  }
  paint(g) {
    g.setColour(Palette.textDim); g.setFont(13, true);
    for (const h of this.headings || []) g.drawText(h.text.toUpperCase(), 6, h.y - this.scroll + 2, this.w - 12, kHeadingH - 4, J.centredLeft);
    if (!this.order.length) {
      g.setColour(Palette.textDim); g.setFont(14);
      g.drawText(mix ? "Nothing in this mix yet." : "", 0, this.emptyY - this.scroll, this.w, 60, J.centred);
    }
    g.setColour(Palette.textDim); g.setFont(12);
    const y = this.contentHeight - 64 - this.scroll;
    g.drawFittedText("Slide a row sideways for its level; tap \u2606 to keep it on top.", 0, y, this.w, 20, J.centred, 1);
    g.drawFittedText("Safari: Share, then Add to Home Screen, for an app icon.", 0, y + 20, this.w, 20, J.centred, 1);
  }
  childAt(e) {   // the control under the finger, and the event in its own coordinates
    const hit = this.content.find(e.x, e.y + this.scroll);
    return hit && hit !== this.content ? hit : null;
  }
  localTo(child, e) {
    const p = child.screenPos(), q = this.screenPos();
    return Object.assign({}, e, { x: e.x + q.x - p.x, y: e.y + q.y - p.y });
  }
  pointerDown(e) {
    if (this.touch) return false;   // one finger at a time in the list
    const child = this.childAt(e);
    this.touch = { id: e.id, x0: e.x, y0: e.y, lastY: e.y, lastT: e.time, child, mode: "pending" };
    this.velocity = 0;
    if (child && child.pointerDown && child instanceof LinearSlider) {   // double-tap a pan: the centre
      const now = e.time, again = this.lastTap.target === child && now - this.lastTap.time < 350;
      this.lastTap = { target: child, time: now };
      if (again && !locked) { child.setNorm(0.5); this.touch.mode = "done"; }
    }
    return true;
  }
  pointerMove(e) {
    const t = this.touch; if (!t || t.id !== e.id) return;
    const dx = e.x - t.x0, dy = e.y - t.y0;
    if (t.mode === "pending") {
      const slider = t.child instanceof SideFader || t.child instanceof LinearSlider;
      if (Math.abs(dx) > 7 && Math.abs(dx) > Math.abs(dy) * 1.2 && slider) {
        if (t.child.pointerDown(this.localTo(t.child, Object.assign({}, e, { taps: 1 })))) t.mode = "drag";
        else t.mode = "done";
      } else if (Math.abs(dy) > 7) t.mode = "scroll";
    }
    if (t.mode === "drag") t.child.pointerMove(this.localTo(t.child, e));
    else if (t.mode === "scroll") {
      const step = e.y - t.lastY, dtm = Math.max(1, e.time - t.lastT) / 1000;
      this.scroll -= step; this.clamp();
      this.velocity = this.velocity * 0.6 + (-step / dtm) * 0.4;
      t.lastY = e.y; t.lastT = e.time;
    }
  }
  pointerUp(e) {
    const t = this.touch; if (!t || t.id !== e.id) return;
    this.touch = null;
    if (t.mode === "drag") t.child.pointerUp(this.localTo(t.child, e));
    else if (t.mode === "pending" && t.child && !e.cancelled && (t.child instanceof TextButton)) {
      const ev = this.localTo(t.child, Object.assign({}, e, { taps: 1 }));
      if (t.child.pointerDown(ev)) t.child.pointerUp(ev);
    }
    if (t.mode !== "scroll" || performance.now() - t.lastT > 80) this.velocity = 0;
  }
}

// A channel's EQ in this mix only (its send EQ to this bus): the curve with a
// handle per band (drag sideways for the frequency, up and down for the gain;
// double-tap for 0 dB), the mid band's Q, On and Flat. Over the list; Close
// goes back.
class EqSheet extends Component {
  constructor() {
    super(); this.takesTouches = true; this.r = null;
    this.close = this.add(new TextButton("Close", () => this.shut()));
    this.flat = this.add(new TextButton("Flat", () => {
      if (locked || !this.r) return;
      for (const f of ["lc", "lsg", "mg", "hsg"]) store.set(eqId(this.r.k, f), eqDefaults[f]);
    }));
  }
  open(r) {
    for (const c of [this.on, this.curve, this.q]) if (c) this.remove(c);
    this.r = r;
    const id = f => eqId(r.k, f), eqOn = () => store.on(id("on"));
    this.on = this.add(new ToggleSwitch(id("on"), Palette.accent, "On")); this.on.locked = isLocked;
    this.curve = this.add(new EqEditor(Palette.accent, isLocked));
    this.curve.setHandles([
      { label: "C", freq: id("lc"), gain: null, minHz: 20, maxHz: 400, offZone: 0.05, on: eqOn },
      { label: "L", freq: id("lsf"), gain: id("lsg"), minHz: 40, maxHz: 500, on: eqOn },
      { label: "M", freq: id("mf"), gain: id("mg"), minHz: 200, maxHz: 8000, on: eqOn },
      { label: "H", freq: id("hsf"), gain: id("hsg"), minHz: 2000, maxHz: 16000, on: eqOn },
    ]);
    this.q = this.add(new LinearSlider(id("mq"))); this.q.locked = isLocked;
    this.q.popupText = () => "Q " + logHz(store.value(id("mq")), 0.5, 4).toFixed(2);
    this.setVisible(true); this.update(r); this.resized(); this.repaint();
  }
  shut() { this.setVisible(false); this.r = null; root.repaint(); }
  update(r) {
    if (!this.r || !r || r.k !== this.r.k) return;
    this.r = r;
    this.curve.points = eqCurves.get(r.k) || null;
    this.curve.repaint(); this.repaint();
  }
  resized() {
    if (!this.on) return;
    const w = this.w;
    this.close.setBounds(w - 10 - 78, 10, 78, 32);
    this.flat.setBounds(w - 10 - 78 - 8 - 64, 10, 64, 32);
    this.on.setBounds(w - 10 - 78 - 8 - 64 - 8 - 56, 10, 56, 32);
    const ch = Math.min(280, Math.max(160, this.h - 200));
    this.curve.setBounds(10, 54, w - 20, ch);
    this.q.setBounds(70, 54 + ch + 12, w - 80, 28);
    this.textY = 54 + ch + 48;
  }
  pointerDown() { return true; }   // the list under it never gets a touch
  paint(g) {
    drawPanel(g, 0, 0, this.w, this.h, Palette.tintedPanel);
    if (!this.r) return;
    const r = this.r, v = f => store.value(eqId(r.k, f));
    g.setColour(Colour.hex(r.colour)); g.fillRoundedRectangle(10, 14, 5, 24, 2.5);
    g.setColour(Palette.text); g.setFont(15, true);
    g.drawFittedText(r.name, 22, 10, this.w - 22 - 250, 32, J.centredLeft, 1);
    g.setColour(Palette.textDim); g.setFont(12.5);
    g.drawText("Mid Q", 10, (this.q ? this.q.y : 0), 56, 28, J.centredLeft);
    const lc = v("lc") < 0.05 ? "Off" : hzText(logHz((v("lc") - 0.05) / 0.95, 20, 400));
    const lines = [
      "C  Low cut: " + lc,
      "L  Low shelf: " + gainText(v("lsg")) + " at " + hzText(logHz(v("lsf"), 40, 500)),
      "M  Mid: " + gainText(v("mg")) + " at " + hzText(logHz(v("mf"), 200, 8000)) + ", Q " + logHz(v("mq"), 0.5, 4).toFixed(2),
      "H  High shelf: " + gainText(v("hsg")) + " at " + hzText(logHz(v("hsf"), 2000, 16000)),
    ];
    g.setColour(store.on(eqId(r.k, "on")) ? Palette.text : Palette.textDim); g.setFont(13.5);
    lines.forEach((t, i) => g.drawText(t, 12, (this.textY || 0) + i * 22, this.w - 24, 20, J.centredLeft));
    g.setColour(Palette.textDim); g.setFont(12);
    g.drawFittedText("Only in your mix: the room and the other mixes don't change. Drag a handle sideways for its frequency, " +
                     "up and down for its gain; double-tap it for 0 dB.", 12, (this.textY || 0) + 4 * 22 + 8, this.w - 24, 36, J.topLeft, 2);
  }
}

class Root extends Component {
  constructor() {
    super();
    this.lock = this.add(new TextButton("Lock", () => { locked = !locked; this.lock.toggle = locked; this.lock.text = locked ? "Locked" : "Lock"; this.repaint(); }));
    fine.load("rkmix.monitor.fine");
    this.fine = this.add(new FineButton());
    // Hide pans (lit while they're hidden): only in a mix with its own pans.
    this.pans = this.add(new TextButton("Hide pans", () => { layout.hidePans = !layout.hidePans; saveLayout(); render(); }));
    this.pans.setVisible(false);
    this.master = this.add(new MasterPanel());
    this.list = this.add(new List());
    this.sheet = this.add(new EqSheet()); this.sheet.setVisible(false);
    this.safe = { top: 0, bottom: 0 };
  }
  column() { const w = Math.min(this.w - 16, 620); return { x: (this.w - w) / 2, w }; }
  resized() {
    const probe = getComputedStyle(document.getElementById("safe"));
    this.safe = { top: parseFloat(probe.paddingTop) / app.scale || 0, bottom: parseFloat(probe.paddingBottom) / app.scale || 0 };
    const c = this.column(), top = this.safe.top;
    this.lock.setBounds(c.x + c.w - 84, top + 8, 84, 32);
    this.fine.setBounds(c.x + c.w - 84 - 6 - 64, top + 8, 64, 32);
    this.pans.setBounds(c.x + c.w - 84 - 6 - 64 - 6 - 84, top + 8, 84, 32);
    this.bannerY = top + 48;
    this.nowY = this.bannerY + (connected ? 0 : 30);
    const y = this.nowY + (nowOf(mix) ? kNowH + 8 : 0);
    this.master.setBounds(c.x, y, c.w, 102);
    this.list.setBounds(c.x, y + 102 + 8, c.w, this.h - (y + 110));
    this.sheet.setBounds(c.x, top + 48, c.w, this.h - top - 48 - this.safe.bottom);
  }
  paint(g) {
    const c = this.column(), top = this.safe.top;
    g.setColour(Palette.tintedPanel); g.fillRect(0, 0, this.w, top + 48);
    g.setColour(Palette.accent); g.fillRect(0, top + 46, this.w, 2);
    const name = gone || (mix ? mix.bus.name : document.title);
    if (mix && !gone) { g.setColour(Colour.hex(mix.bus.colour)); g.fillRoundedRectangle(c.x + 2, top + 12, 6, 24, 2); }
    g.setColour(Palette.text); g.setFont(17, true);
    g.drawText(name, c.x + 16, top, c.w - 16 - 96 - 70 - (this.pans.visible ? 90 : 0), 46, J.centredLeft);
    if (!connected) {
      g.setColour(Palette.warning); g.fillRect(0, this.bannerY, this.w, 26);
      g.setColour(Colour.hex(0xff15161a)); g.setFont(13);
      g.drawText("Not connected to RKMix: trying again…", 0, this.bannerY, this.w, 26, J.centred);
    }
    const now = nowOf(mix);
    if (now) drawNow(g, now, c.x, this.nowY + 6, c.w, kNowH);
  }
}

const root = new Root();

function render() {
  if (!mix) return;
  const b = mix.bus, p = {};
  document.title = b.name;
  p.fader = [faderPositionOf(b.fader), dbText(b.fader), faderPositionOf(0), 0];
  p.mute = [b.mute ? 1 : 0, b.mute ? "On" : "Off", 0, 2];
  // Starred rows always show, on top; the rest as before.
  const me = mix.rows.filter(r => layout.me.has(r.k)), others = mix.rows.filter(r => !layout.me.has(r.k) && (showAll || r.used));
  for (const r of mix.rows) {
    p["send:" + r.k] = [faderPositionOf(r.send), dbText(r.send), faderPositionOf(0), 0];
    p["pan:" + r.k] = [(r.pan + 100) / 200, "", 0.5, 201];
    if (r.eq) {
      eqFields.forEach((f, i) => { p[eqId(r.k, f)] = [r.eq[i], "", eqDefaults[f], f === "on" ? 2 : 0]; });
      if (r.eqc) eqCurves.set(r.k, r.eqc); else eqCurves.delete(r.k);
    }
  }
  store.receive(p);
  if (root.sheet.r) {
    const r = mix.rows.find(x => x.k === root.sheet.r.k);
    if (r && r.eq) root.sheet.update(r); else root.sheet.shut();
  }
  root.list.setRows(me, others, b.own);
  root.pans.setVisible(!!b.own); root.pans.toggle = layout.hidePans; root.repaint();
  const now = JSON.stringify(nowOf(mix));
  if (now !== lastNow) { lastNow = now; root.resized(); root.repaint(); }
}

let lastMeters = 0;
function meters(m) {
  root.master.fader.meter.feed(linToDb(m.bus || 0));
  for (const [k, row] of root.list.rows) row.fader.meter.feed(linToDb(m.rows[k] || 0));
  lastMeters = performance.now();
}
app.frameHooks.add(dt => {
  let moved = root.master.fader.meter.step(dt);
  for (const row of root.list.rows.values()) moved = row.fader.meter.step(dt) || moved;
  if (moved) app.dirty = true;
});

function setConnected(on) { if (connected !== on) { connected = on; root.resized(); root.repaint(); } }
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/" + KEY);
  ws.onopen = () => setConnected(true);
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "mix") { gone = ""; mix = msg; render(); }
    else if (msg.type === "meters") meters(msg);
    else if (msg.type === "gone") { gone = msg.text; app.dirty = true; }
  };
  ws.onclose = () => { setConnected(false); setTimeout(connect, 2000); };
}

app.start(root, 0, { fitWidth: 390 });
connect();
})();
</script>
